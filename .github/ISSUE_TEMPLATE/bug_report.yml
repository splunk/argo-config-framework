name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels: ["bug"]
body:
- type: markdown
  attributes:
    value: Do not include secrets, credentials, customer data, or vulnerability details.
- type: textarea
  id: description
  attributes:
    label: Description
    description: What happened, and what did you expect?
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: Reproduction
    description: Provide a minimal catalog, command, and relevant output.
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Version or commit
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Environment
    description: Include Python, Argo, Kubernetes, and adapter versions when relevant.
