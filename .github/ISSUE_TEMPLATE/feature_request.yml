name: Feature request
description: Propose a focused enhancement.
title: "[Feature]: "
labels: ["enhancement"]
body:
- type: textarea
  id: problem
  attributes:
    label: Problem
    description: What use case is not covered?
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Proposed behavior
    description: Describe the desired behavior and compatibility considerations.
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives considered
